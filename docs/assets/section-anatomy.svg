<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Markdown section anatomy</title>
  <desc id="desc">A readable diagram labeling the type, attributes, content, closing fence, source span, and checksum of a Markdown section.</desc>
  <rect width="1400" height="700" fill="#050505"/>
  <text x="80" y="92" fill="#F2F0EA" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="46" font-weight="700">Section anatomy</text>
  <text x="82" y="130" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="18">A primitive is a bounded source span with a contract.</text>

  <rect x="80" y="178" width="760" height="380" fill="#0F0F0F" stroke="#262626" stroke-width="2"/>
  <rect x="80" y="178" width="760" height="42" fill="#1A1A1A"/>
  <text x="110" y="205" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="15">input.md</text>

  <text x="116" y="272" fill="#737373" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="17">12</text>
  <text x="116" y="334" fill="#737373" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="17">13</text>
  <text x="116" y="396" fill="#737373" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="17">14</text>
  <rect x="154" y="244" width="632" height="178" fill="#1A0808" stroke="#990001" stroke-width="2"/>

  <rect x="218" y="248" width="42" height="32" fill="#330909" stroke="#990001" stroke-width="1"/>
  <rect x="266" y="248" width="430" height="32" fill="#131313" stroke="#262626" stroke-width="1"/>
  <rect x="172" y="310" width="330" height="32" fill="#131313" stroke="#262626" stroke-width="1"/>
  <rect x="172" y="372" width="42" height="32" fill="#131313" stroke="#262626" stroke-width="1"/>

  <text x="178" y="272" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="22">:::</text>
  <text x="218" y="272" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="22">cta</text>
  <text x="266" y="272" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="22">{href="/demo" label="Book demo"}</text>
  <text x="178" y="334" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="22">Bring one broken workflow.</text>
  <text x="178" y="396" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="22">:::</text>

  <rect x="178" y="466" width="218" height="44" fill="#111111" stroke="#262626" stroke-width="1"/>
  <rect x="426" y="466" width="306" height="44" fill="#111111" stroke="#262626" stroke-width="1"/>
  <text x="202" y="494" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="17">source: L12-L14</text>
  <text x="450" y="494" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="17">sha256: 9f1c2a7b...</text>

  <rect x="910" y="196" width="390" height="320" fill="#0F0F0F" stroke="#262626" stroke-width="2"/>
  <text x="944" y="234" fill="#737373" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="14">PRIMITIVE PARTS</text>
  <rect x="944" y="258" width="14" height="14" fill="#990001"/>
  <text x="976" y="272" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">type</text>
  <text x="1130" y="272" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">cta</text>
  <line x1="944" y1="296" x2="1266" y2="296" stroke="#262626" stroke-width="1"/>

  <rect x="944" y="324" width="14" height="14" fill="#262626" stroke="#990001"/>
  <text x="976" y="338" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">attributes</text>
  <text x="1130" y="338" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">href, label</text>
  <line x1="944" y1="362" x2="1266" y2="362" stroke="#262626" stroke-width="1"/>

  <rect x="944" y="390" width="14" height="14" fill="#262626"/>
  <text x="976" y="404" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">content</text>
  <text x="1130" y="404" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">line 13</text>
  <line x1="944" y1="428" x2="1266" y2="428" stroke="#262626" stroke-width="1"/>

  <rect x="944" y="456" width="14" height="14" fill="#D87A22"/>
  <text x="976" y="470" fill="#F2F0EA" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">gate</text>
  <text x="1130" y="470" fill="#2E7D4F" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">checksum</text>
</svg>
