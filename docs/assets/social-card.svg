  <text x="84" y="178" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="22">manifest -&gt; diff -&gt; checksum gate -&gt; patch</text>
  <rect x="84" y="242" width="500" height="210" fill="#050505" stroke="#262626"/>
