<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">nocturnal/markdown-sections social card</title>
  <desc id="desc">Safe Markdown edits for agents with a selected section and patch receipt.</desc>
