<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Safe Markdown edits for agents</title>
  <desc id="desc">A Markdown document, selected section, patch receipt, and checksum gate.</desc>
  <rect width="1400" height="700" fill="#050505"/>
  <rect x="42" y="42" width="1316" height="616" fill="#0F0F0F" stroke="#262626" stroke-width="2"/>
