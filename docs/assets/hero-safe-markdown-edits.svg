  <text x="82" y="142" fill="#B3B3B3" font-family="JetBrains Mono, Cascadia Mono, monospace" font-size="20">manifest -&gt; diff -&gt; checksum gate -&gt; patch</text>

  <rect x="80" y="190" width="560" height="390" rx="0" fill="#050505" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="80" y="190" width="560" height="38" fill="#1A1A1A"/>
  <text x="104" y="215" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="15">input.md</text>
  <text x="112" y="270" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">01</text>
  <text x="112" y="306" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">02</text>
  <text x="112" y="342" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">03</text>
  <text x="112" y="378" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">04</text>
  <text x="112" y="414" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">05</text>
  <text x="112" y="450" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16">06</text>
  <text x="160" y="270" fill="#F2F0EA" font-family="JetBrains Mono, monospace" font-size="17"># Campaign Page</text>
  <text x="160" y="306" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="17">Opening copy stays untouched.</text>
  <rect x="146" y="320" width="440" height="112" fill="#1A0808" stroke="#990001" stroke-width="2"/>
  <text x="160" y="342" fill="#F2F0EA" font-family="JetBrains Mono, monospace" font-size="17">:::cta{href="/demo" label="Book demo"}</text>
  <text x="160" y="378" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="17">Old call to action.</text>
  <text x="160" y="414" fill="#F2F0EA" font-family="JetBrains Mono, monospace" font-size="17">:::</text>
  <text x="160" y="450" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="17">Closing copy stays untouched.</text>

  <path d="M640 376 L744 376" stroke="#990001" stroke-width="4"/>
  <path d="M744 376 L724 362 M744 376 L724 390" stroke="#990001" stroke-width="4"/>
  <text x="676" y="348" fill="#B3B3B3" font-family="JetBrains Mono, monospace" font-size="14" text-anchor="middle">selected span only</text>

  <rect x="760" y="206" width="520" height="340" fill="#050505" stroke="#262626" stroke-width="2"/>
  <rect x="760" y="206" width="520" height="44" fill="#1A1A1A"/>
  <text x="790" y="235" fill="#F2F0EA" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">PATCH-004 PASS</text>
  <text x="790" y="294" fill="#737373" font-family="JetBrains Mono, monospace" font-size="15">operation</text>
  <text x="930" y="294" fill="#F2F0EA" font-family="JetBrains Mono, monospace" font-size="15">update cta</text>
  <text x="790" y="330" fill="#737373" font-family="JetBrains Mono, monospace" font-size="15">diff preview</text>
  <text x="930" y="330" fill="#2E7D4F" font-family="JetBrains Mono, monospace" font-size="15">ready</text>
  <text x="790" y="366" fill="#737373" font-family="JetBrains Mono, monospace" font-size="15">checksum</text>
  <text x="930" y="366" fill="#2E7D4F" font-family="JetBrains Mono, monospace" font-size="15">matched</text>
  <text x="790" y="402" fill="#737373" font-family="JetBrains Mono, monospace" font-size="15">validation</text>
  <text x="930" y="402" fill="#2E7D4F" font-family="JetBrains Mono, monospace" font-size="15">passed</text>
  <rect x="790" y="430" width="420" height="62" fill="#0F0F0F" stroke="#262626"/>
  <text x="812" y="456" fill="#B00000" font-family="JetBrains Mono, monospace" font-size="15">- Old call to action.</text>
  <text x="812" y="480" fill="#2E7D4F" font-family="JetBrains Mono, monospace" font-size="15">+ Plan the repair.</text>

  <text x="80" y="628" fill="#F2F0EA" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="26" font-weight="700">Untouched Markdown stays untouched.</text>
