name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, zip

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --prefer-dist
          else
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: Run QA
        run: composer qa

      - name: Audit dependencies
        run: composer audit

      - name: Create and inspect source archive
        if: matrix.php == '8.4' && matrix.dependencies == 'highest'
        run: |
          composer archive --format=zip --dir=build --file=markdown-sections
          composer check-archive -- build/markdown-sections.zip

      - name: Install archive in a fresh consumer
        if: matrix.php == '8.4' && matrix.dependencies == 'highest'
        run: |
          mkdir -p build/package build/consumer
          unzip -q build/markdown-sections.zip -d build/package
          cat > build/consumer/composer.json <<'JSON'
          {
            "name": "nocturnal/release-smoke",
            "require": {"nocturnal/markdown-sections": "dev-release"},
            "repositories": [{"type": "path", "url": "../package", "options": {
              "symlink": false, "versions": {"nocturnal/markdown-sections": "dev-release"}
            }}]
          }
          JSON
          composer install --working-dir=build/consumer --no-dev --no-interaction --no-progress --prefer-dist
          php tools/check-consumer.php build/consumer/vendor/autoload.php
